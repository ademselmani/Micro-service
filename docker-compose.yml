version: '3.8'
services:
  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: discovery_container
    ports:
      - "8761:8761"
    environment:
      - SPRING_APPLICATION_NAME=discovery-service
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
    networks:
      - my_network
    volumes:
      - discovery-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: curl --fail --silent http://localhost:8761/actuator/health || exit 0
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway_container
    ports:
      - "8078:8078"
    depends_on:
      discovery:
        condition: service_healthy
      chombre:
        condition: service_started
    environment:
      - SPRING_APPLICATION_NAME=gateway-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - SERVER_PORT=8078
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=false
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY=DEBUG
      - LOGGING_LEVEL_REACTOR_NETTY=DEBUG
    networks:
      - my_network
    volumes:
      - gateway-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8078/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  chombre:
    build:
      context: ./chombre
      dockerfile: Dockerfile
    container_name: chombre_container
    hostname: chombre
    ports:
      - "8091:8090"
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=chombre-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - SERVER_PORT=8090
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/chombre_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
      - SPRING_DATASOURCE_DRIVERCLASSNAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_H2_CONSOLE_ENABLED=true
      - SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS=true
    networks:
      - my_network
    volumes:
      - chombre-logs:/app/logs
      - chombre-data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./chombre-frontend
      dockerfile: Dockerfile
    container_name: frontend_container
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://gateway:8078/api
    networks:
      - my_network
    restart: unless-stopped

networks:
  my_network:
    driver: bridge

volumes:
  discovery-logs:
  gateway-logs:
  chombre-logs:
  chombre-data:

 
