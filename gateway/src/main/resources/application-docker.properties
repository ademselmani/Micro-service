# Application Configuration
spring.application.name=gateway-service
server.port=8078

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://discovery:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway Routes Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Direct Route for all requests to chombre
spring.cloud.gateway.routes[0].id=chombre-all
spring.cloud.gateway.routes[0].uri=http://chombre:8090
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/(?<segment>.*), /$\{segment}
spring.cloud.gateway.routes[0].filters[1]=PreserveHostHeader

# Separate route for image paths
spring.cloud.gateway.routes[1].id=chombre-images
spring.cloud.gateway.routes[1].uri=http://chombre:8090
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/images/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/images/(?<segment>.*), /images/$\{segment}
spring.cloud.gateway.routes[1].filters[1]=PreserveHostHeader

# Logging Configuration
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG

# Actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always 