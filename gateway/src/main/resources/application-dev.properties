# Development profile for gateway service
spring.application.name=gateway
server.port=8078

# Eureka Client Configuration for local development
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Routes Configuration for local development
spring.cloud.gateway.routes[0].id=chombre-service
spring.cloud.gateway.routes[0].uri=lb://chombre-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/(?<segment>.*), /${segment}

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG 