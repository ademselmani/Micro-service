<div class="container mt-5">
  <h1 class="text-center text-primary">🏠 Liste des Foyers</h1>

  <!-- Ajouter Foyer Button -->
  <button
    class="btn btn-primary mb-3"
    (click)="showAddFoyerForm = !showAddFoyerForm"
  >
    + Ajouter un Foyer
  </button>

  <!-- Formulaire d'ajout de Foyer -->
  <div *ngIf="showAddFoyerForm" class="mt-4 card p-3 shadow-sm">
    <h3 class="text-center text-primary">Ajouter un Foyer</h3>

    <form (ngSubmit)="addFoyer()">
      <div class="mb-3">
        <label class="form-label">Nom du Foyer</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="newFoyer.nomFoyer"
          name="nomFoyer"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Capacité</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="newFoyer.capaciteFoyer"
          name="capaciteFoyer"
          required
        />
      </div>

      <button type="submit" class="btn btn-success">💾 Ajouter</button>
      <button
        type="button"
        class="btn btn-secondary ms-2"
        (click)="cancelAdd()"
      >
        ❌ Annuler
      </button>
    </form>
  </div>

  <!-- Foyer List Table -->
  <table class="table table-striped table-hover mt-4 shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Nom du Foyer</th>
        <th>Capacité</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let foyer of foyers; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ foyer.nomFoyer }}</td>
        <td>{{ foyer.capaciteFoyer }}</td>
        <td>
          <span
            class="badge"
            [ngClass]="foyer.capaciteFoyer > 100 ? 'bg-success' : 'bg-warning'"
          >
            {{
              foyer.capaciteFoyer > 100 ? "Grande capacité" : "Capacité normale"
            }}
          </span>
        </td>
        <td>
          <button class="btn btn-warning btn-sm" (click)="editFoyer(foyer)">
            ✏️ Modifier
          </button>
          <button
            class="btn btn-danger btn-sm ms-2"
            (click)="deleteFoyer(foyer.idFoyer)"
          >
            🗑️ Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Formulaire d'édition (Modifier un Foyer) -->
  <div *ngIf="selectedFoyer" class="mt-4 card p-3 shadow-sm">
    <h3 class="text-center text-primary">Modifier le Foyer</h3>

    <form (ngSubmit)="updateFoyer()">
      <div class="mb-3">
        <label class="form-label">Nom du Foyer</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="selectedFoyer!.nomFoyer"
          name="nomFoyer"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Capacité</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="selectedFoyer!.capaciteFoyer"
          name="capaciteFoyer"
          required
        />
      </div>

      <button type="submit" class="btn btn-success">💾 Enregistrer</button>
      <button
        type="button"
        class="btn btn-secondary ms-2"
        (click)="cancelEdit()"
      >
        ❌ Annuler
      </button>
    </form>
  </div>
</div>
